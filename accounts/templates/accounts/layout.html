{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        {% block title %}
        
        {% endblock %}
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{% static 'accounts/layout.css' %}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
        {% block links %}

        {% endblock %}

    </head>
    <body>
        <nav class="navbar">
            <div class="title-container">
                <h3 class="name"><a href="{% url 'accounts:homepage' %}">SkillStack</a></h3>
                <img class="logo" src="{% static 'accounts/images/logo.png' %}">
            </div>

            <div class="button-container">
                {% if user.is_authenticated %}
                    <button class="logout-btn"><a href="{% url 'accounts:logout' %}">Logout</a></button>  
                {% else %}
                    <button class="register-btn"><a href="{% url 'accounts:register' %}">Register</a></button>
                    <button class="login-btn"><a href="{% url 'accounts:login' %}">Login</a></button>
                {% endif %}
            </div>

        </nav>
        <div class="body-container">
            {% block body %}

            {% endblock %}
        </div>
        
    </body>
</html>
