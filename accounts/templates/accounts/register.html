{% extends 'accounts/layout.html' %}
{% load static %}

{% block title %}
    <title>Register</title>
{% endblock %}

{% block links %}
    <link rel="stylesheet" href="{% static 'accounts/auth.css' %}">
{% endblock %}

{% block body %}
    <div class="card-container">
        <div class="auth-container">
            <h3 class="header">Register</h3>
            <form action="{% url 'accounts:register' %}" method="post" class="auth-form">
                {% csrf_token %}
                <div class="field-container">
                    <label>Username:</label>
                    <input name="username" placeholder="John" type="text">
                </div>

                <div class="field-container">
                    <label>Email:</label>
                    <input name="email" placeholder="John@gmail.com" type="email">
                </div>

                <div class="field-container">
                    <label>Password:</label>
                    <input name="password" placeholder="12345678" type="password">
                </div>

                <div>
                    <button type="submit" class="submit-btn">Register</button>
                    <p class="alternate-option">Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p>
                </div>
                
                


            </form>
            
        </div>
    </div>
    

{% endblock %}
