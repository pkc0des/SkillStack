{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block title %} {% endblock %}
    <link rel="stylesheet" href="{% static 'study/layout.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

    {% block links %}
    

    {% endblock %}
    


</head>
<body>
    <nav class="navbar">
        <div class="title-container">
            <h3 class="name"><a href="{% url 'accounts:homepage' %}">SkillStack</a></h3>
            <img class="logo" src="{% static 'accounts/images/logo.png' %}">
        </div>

        <div class="option-container">
            <div class="option">
                <a class="option-name" href="{% url 'study:dashboard' %}">Dashboard</a>
            </div>

            <div class="option">
                <a class="option-name" href="{% url 'study:pomodoro' %}">Pomodoro</a>
            </div>

            <div class="option">
                <a class="option-name" href="{% url 'study:log_hours' %}">Log Hours</a>
            </div>

            <div class="option">
                <a class="option-name" href="{% url 'coach:chat' %}">AI Coach</a>
            </div>
        </div>

        <div class="motivation-list">
            <ul class="motivational-words-list">
                <li>Focus.</li>
                <li>Study Hard.</li>
                <li>Lock In.</li>
                <li>Do it.</li>
                <li>Discipline.</li>
                <li>Consistency</li>

            </ul>

        </div>

        <div class="button-container">
            <button class="logout-btn"><a href="{% url 'accounts:logout' %}">Logout</a></button>
        </div>

    </nav>

    {% block body %}

    {% endblock %}
    
</body>
</html>
